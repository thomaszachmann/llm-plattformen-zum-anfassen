# OpenTelemetry Collector (Deployment) – Konfiguration wie otel/collector.yaml
mode: deployment
fullnameOverride: otel-collector   # Service: otel-collector.monitoring.svc
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib   # enthält tail_sampling
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }
ports:                       # nur OTLP und Metriken
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }
alternateConfig:             # ersetzt die Chart-Defaults komplett (kein Merge)
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    tail_sampling:
      decision_wait: 10s          # so lange auf alle Spans eines Traces warten
      num_traces: 20000
      policies:
        - name: fehler-immer
          type: status_code
          status_code: { status_codes: [ERROR] }
        - name: langsam-immer
          type: latency
          latency: { threshold_ms: 10000 }
        - name: rest-10-prozent
          type: probabilistic
          probabilistic: { sampling_percentage: 10 }
    batch: {}
  exporters:
    otlp_grpc/tempo:
      endpoint: tempo.monitoring.svc:4317
      tls: { insecure: true }
  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, tail_sampling, batch]
        exporters: [otlp_grpc/tempo]
