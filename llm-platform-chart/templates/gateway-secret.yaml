{{- if not .Values.gateway.existingSecret }}
{{- if not .Values.gateway.tenants }}
{{- fail "gateway.tenants oder gateway.existingSecret muss gesetzt sein" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-platform.secretName" . }}
  labels:
    {{- include "llm-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $pairs := list }}
  {{- range $tenant, $key := .Values.gateway.tenants }}
  {{- $pairs = append $pairs (printf "%s:%s" $tenant $key) }}
  {{- end }}
  TENANT_KEYS: {{ join "," $pairs | quote }}
{{- end }}
