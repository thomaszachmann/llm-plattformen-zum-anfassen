[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llmctl"
version = "0.1.0"
description = "SRE-CLI für das llm-gateway (Lab-Code)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
llmctl = "llmctl.cli:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S311"]  # random für Jitter ist ok, keine Kryptografie

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert ist in pytest erwünscht

[tool.pytest.ini_options]
testpaths = ["tests"]
