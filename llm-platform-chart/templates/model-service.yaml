apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-platform.fullname" . }}-model
  labels:
    {{- include "llm-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: model
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: model
  ports:
    - name: http
      port: 11434
      targetPort: http
