{{- if .Values.modelServer.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llm-platform.fullname" . }}-models
  labels:
    {{- include "llm-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # Modelle überleben helm uninstall
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.modelServer.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.modelServer.persistence.size }}
{{- end }}
