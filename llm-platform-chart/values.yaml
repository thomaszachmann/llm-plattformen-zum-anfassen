# Air-Gap: alle Images kommen aus dieser Registry (leer = Original-Registry)
global:
  imageRegistry: ""
  imagePullSecrets: []

gateway:
  replicas: 2
  image:
    repository: llm-gateway
    tag: dev
    pullPolicy: IfNotPresent
  rateLimit:
    rps: 5
    burst: 10
  # Name eines vorhandenen Secrets mit Schlüssel TENANT_KEYS.
  # Leer = Chart erzeugt das Secret aus "tenants" (nur Lab!).
  existingSecret: ""
  tenants:
    acme: lab-key-acme
    globex: lab-key-globex
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}

modelServer:
  image:
    repository: ollama/ollama
    tag: "0.40.2"
    pullPolicy: IfNotPresent
  models:
    - ministral-3:3b
  # true: initContainer zieht die Modelle aus dem Internet (nicht im Air-Gap!)
  pullOnStart: true
  # Air-Gap: OCI-Image, das unter /models ein fertiges Ollama-Modellverzeichnis
  # enthält (Tag 14, Drill 5). Gesetzt = Kopie statt Download.
  modelImage:
    repository: ""
    tag: ""
  keepAlive: "24h"
  numParallel: 2
  contextLength: 4096
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests: {cpu: "2", memory: 6Gi}
    limits: {memory: 8Gi}
  gpu:
    enabled: false
    count: 1
  nodeSelector: {}
  tolerations: []

networkPolicy:
  enabled: true
