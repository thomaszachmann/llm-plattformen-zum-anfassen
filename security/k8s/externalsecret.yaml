# Lab-Beispiel (Tag 13): TENANT_KEYS aus OpenBao per External Secrets Operator
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-keys
  namespace: llm-system
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}  # Kubernetes-Auth
  target:
    name: llm-gateway-keys
    template:
      data:
        TENANT_KEYS: "acme:{{ .acme }},globex:{{ .globex }}"
  dataFrom:
    - extract: {key: llm-gateway/tenant-keys}
