# Loki monolithisch (ein Pod), Dateisystem-Storage, ohne Caches – nur fürs Lab
deploymentMode: Monolithic
loki:
  auth_enabled: false             # kein X-Scope-OrgID nötig (ein Mandant)
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 72h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence: { size: 5Gi }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
