apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-gateway
  namespace: llm-system
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  namespaceSelector:
    matchNames: [llm-system]
  endpoints:
    - port: http            # Name des Service-Ports, nicht die Nummer
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
