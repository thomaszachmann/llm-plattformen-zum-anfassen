apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm-system
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: llm-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: llm-gateway}
    spec:
      automountServiceAccountToken: false     # Gateway braucht keine K8s-API
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532                       # nonroot aus distroless
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gw
          image: localhost:5055/llm-gateway:dev
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 128Mi}
